      }
      cerrarModal(); toast('Datos guardados'); render();
    } catch (e) { fl.enviando = false; fl.error = e.message; if (UI.flujo === fl) renderModal(); }
  },
  evento: async f => {
    const ev = MODAL.id ? evento(MODAL.id) : null;
    const g = k => f.elements[k].value;
    const v = { titulo: g('titulo').trim(), descripcion: g('descripcion').trim(), fecha: g('fecha'), inicio: g('inicio'), termino: g('termino'), lugar: g('lugar').trim(), aforo: parseInt(g('aforo'), 10) };
    const e = {};
    if (!v.titulo) e.titulo = 'Ingrese un título.';
    if (!v.descripcion) e.descripcion = 'Agregue una descripción breve.';
    if (!v.fecha) e.fecha = 'Elija la fecha.';
    if (!v.inicio) e.inicio = 'Indique la hora de inicio.';
    if (!v.termino) e.termino = 'Indique la hora de término.';
    else if (v.inicio && v.termino <= v.inicio) e.termino = 'Debe ser posterior al inicio.';
    if (!v.lugar) e.lugar = 'Indique el lugar.';
    if (!Number.isFinite(v.aforo) || v.aforo < 1) e.aforo = 'Mínimo 1 persona.';
    else if (v.aforo > 500) e.aforo = 'Máximo 500 personas.';
    else if (ev && v.aforo < (ev.ocupados || 0)) e.aforo = 'Ya hay ' + ev.ocupados + ' reservas.';
    MODAL.valores = v; MODAL.errores = e; MODAL.errorGeneral = null;
    if (Object.keys(e).length) { renderModal(); return; }
    const m = MODAL;
    m.enviando = true; renderModal();
    try {
      const r = await api('guardarEvento', Object.assign({ id: m.id || null }, v));
      toast(r.avisados ? 'Evento actualizado. Se avisó a ' + plural(r.avisados, 'persona', 'personas') + '.' : (m.id ? 'Evento actualizado' : 'Evento publicado'));
      if (MODAL === m) cerrarModal();
    } catch (err) { m.enviando = false; m.errorGeneral = err.message; if (MODAL === m) renderModal(); }
  },
  codigo: f => { registrarCodigo(f.elements.codigo.value); f.elements.codigo.value = ''; },
  encuesta: async f => {
    const E = UI.encuesta;
    if (!E || E.enviando) return;
    const valores = CONFIG.preguntas.map((_, i) => { const x = f.querySelector('input[name="p' + i + '"]:checked'); return x ? Number(x.value) : null; });
    E.valores = valores; E.comentario = f.elements.comentario.value;
    const falta = valores.findIndex(v => v == null);
    if (falta >= 0) {
      E.error = 'Responda los cinco aspectos para enviar la encuesta.';
      const err = document.getElementById('err-encuesta'); if (err) { err.textContent = E.error; err.hidden = false; }
      const item = f.querySelectorAll('.item')[falta];
      if (item) item.scrollIntoView({ block: 'center' });
      return;
    }
    E.enviando = true; E.error = null; render();
    const r = ruta();
    try {
      if (r[0] === 'encuesta') await api('responderEncuesta', { token: r[1], valores, comentario: E.comentario });
      else {
        await api('responderEncuesta', { eventoId: r[1], valores, comentario: E.comentario });
        S.reservas.forEach(x => { if (x.eventoId === r[1]) { x.respondida = true; x.encuestaPendiente = false; } });
      }
      E.enviada = true;
    } catch (e) {
      E.error = e.message;
      if (e.codigo === 'already-exists') { E.enviada = false; if (E.info) E.info.respondida = true; }
    }
    E.enviando = false;
    render();
    window.scrollTo(0, 0);
  }
};

/* ===================== Eventos del navegador ===================== */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-accion]');
  if (!b) return;
  const accion = b.dataset.accion;
  if (accion === 'fondo-modal') { if (e.target === b && !(MODAL && MODAL.enviando)) cerrarModal(); return; }
  if (b.disabled) return;
  const fn = ACCIONES[accion];
  if (!fn) return;
  e.preventDefault();
  fn(b.dataset.id, b, e);
});
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]');
  if (!f) return;
  e.preventDefault();
  const fn = FORMULARIOS[f.dataset.form];
  if (fn) fn(f);
});
document.addEventListener('change', e => {
  const s = e.target;
  if (s.matches('[data-cambio="rec-evento"]')) { detenerCamara(); UI.rec = Object.assign(UI.rec, { eventoId: s.value, lista: null, error: null, busqueda: '', resultado: null }); render(); }
  if (s.matches('[data-cambio="res-evento"]')) { UI.res = { eventoId: s.value, datos: null, cargando: false, error: null }; render(); }
  if (s.matches('form[data-form="encuesta"] input[type="radio"]') && UI.encuesta) {
    UI.encuesta.valores[Number(s.name.slice(1))] = Number(s.value);
    const err = document.getElementById('err-encuesta'); if (err) err.hidden = true;
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.matches('[data-filtro="rec"]')) { UI.rec.busqueda = t.value; filtrarPersonas(); }
  if (t.matches('textarea[name="descripcion"]')) { const c = document.getElementById('contador-desc'); if (c) c.textContent = t.value.length + ' de 400'; }
  if (t.matches('form[data-form="encuesta"] textarea') && UI.encuesta) UI.encuesta.comentario = t.value;
});
document.addEventListener('focusout', () => {
  setTimeout(() => { if (renderPendiente && !escribiendoEnApp() && !UI.camara) render(); }, 0);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && MODAL && !MODAL.enviando) cerrarModal(); });
window.addEventListener('hashchange', () => {
  detenerCamara();
  const r = ruta();
  if (!((r[0] === 'reserva' || r[0] === 'entrada') && r[1] === UI.recienReservada)) UI.recienReservada = null;
  if (r[0] === 'mis-reservas') UI.misTab = null;
  if (r[0] !== 'encuesta' && r[0] !== 'encuesta-reserva') UI.encuesta = null;
  UI.rec.resultado = null;
  if (MODAL && !(MODAL.tipo === 'flujo' && UI.flujo && UI.flujo.paso === 'confirmar-correo')) cerrarModal();
  render();
  window.scrollTo(0, 0);
  document.getElementById('app').focus({ preventScroll: true });
});

/* ===================== Inicio ===================== */
onSnapshot(collection(db, 'eventos'), snap => {
  S.eventos = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
  S.eventosListos = true; S.errorEventos = false;
  programarRender();
  continuarIntencion();
}, () => { S.eventosListos = true; S.errorEventos = true; programarRender(); });

onAuthStateChanged(auth, user => {
  S.authListo = true;
  if (!user) {
    S.usuario = null; S.perfil = null; S.rol = null; S.reservas = []; S.cuentaLista = true;
    programarRender();
    return;
  }
  S.usuario = { uid: user.uid, email: String(user.email || '').toLowerCase() };
  S.cuentaLista = false;
  programarRender();
  cargarCuenta();
});

revisarEnlaceDeIngreso();
render();
setInterval(() => {
  const r = ruta();
  if (r[0] === 'panel' && S.rol && tabPanel() === 'recepcion' && UI.rec.eventoId && !UI.rec.cargando && Date.now() - UI.rec.cargadoMs > 20000) cargarRecepcion();
  if (!renderPendiente && !MODAL && !escribiendoEnApp() && !UI.camara && r[0] !== 'encuesta' && r[0] !== 'encuesta-reserva') render();
}, 30000);
</script>
