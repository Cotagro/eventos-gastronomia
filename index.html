function dibujarQR(){
  document.querySelectorAll('[data-qr]').forEach(el => {
    el.innerHTML = '';
    if (typeof QRCode === 'function') {
      try { new QRCode(el, { text: el.getAttribute('data-qr'), width: 176, height: 176, colorDark: '#16110A', colorLight: '#F2E8D5', correctLevel: QRCode.CorrectLevel.M }); return; }
      catch (e) {}
    }
    el.innerHTML = '<span class="qr-sin">El código QR se muestra con conexión a internet.</span>';
  });
}
function render(){
  const r = ruta();
  const enPanel = r[0] === 'panel';
  renderProto(enPanel);
  renderCabecera(enPanel, r);
  let html;
  if (enPanel) html = panelAbierto ? vistaPanel(r[1] || 'eventos') : vistaAccesoPanel();
  else if (r[0] === 'evento') html = vistaDetalle(r[1]);
  else if (r[0] === 'reserva') html = vistaReserva(r[1]);
  else if (r[0] === 'mis-reservas') html = vistaMisReservas();
  else if (r[0] === 'encuesta') html = vistaEncuesta(r[1]);
  else html = vistaInicio();
  document.getElementById('app').innerHTML = html;
  document.body.classList.toggle('con-barra', !enPanel && r[0] === 'evento' && !!(r[1] && evento(r[1])));
  renderPie(enPanel);
  dibujarQR();
  if (enPanel && panelAbierto && r[1] === 'recepcion') filtrarPersonas();
}
function enfocar(){
  const el = document.querySelector('#app [data-enfoque]') || document.getElementById('app');
  el.focus({ preventScroll: true });
}
let toastT;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('visible');
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove('visible'), 3200);
}

/* ===================== Acciones ===================== */
const ACCIONES = {
  'vista-participante': () => ir('#/'),
  'vista-panel': () => ir('#/panel'),
  'bloquear-panel': () => { detenerCamara(); bloquearPanel(); toast('Sesión del panel cerrada'); ir('#/'); },
  'restablecer': () => confirmar({ titulo: 'Restablecer datos de ejemplo', texto: 'Se borrarán los eventos, reservas y respuestas creados en esta prueba.', si: 'Restablecer' }, () => {
    detenerCamara();
    try { localStorage.removeItem(CLAVE); } catch (e) {}
    sembrar(); planificador(); guardar();
    Object.assign(UI, { fechaFiltro: 'todas', recienReservada: null, gracias: null, misTab: null, panelEvento: null, resultadosEvento: null, recepcion: { busqueda: '', resultado: null } });
    ir('#/'); toast('Datos restablecidos');
  }),
  'filtro-fecha': id => { UI.fechaFiltro = id; render(); },
  'reservar': id => abrirFlujo(id),
  'ingresar': () => abrirFlujo(null),
  'salir': () => { S.sesion = null; guardar(); toast('Sesión cerrada'); render(); },
  'cerrar-modal': () => cerrarModal(),
  'simular-enlace': () => {
    const f = UI.flujo;
    S.sesion = { email: f.email };
    guardar();
    const p = S.perfiles[f.email];
    if (!p) { f.paso = 'datos'; f.perfilSel = perfilPorDominio(f.email); f.error = null; renderModal(); render(); return; }
    if (f.eventoId) {
      const ya = reservaDe(f.eventoId, f.email);
      if (ya) { cerrarModal(); toast('Ya tiene una reserva para este evento'); ir('#/reserva/' + ya.id); return; }
      f.paso = 'confirmar'; f.error = null; renderModal(); render(); return;
    }
    cerrarModal(); toast('Sesión iniciada'); render();
  },
  'otro-correo': () => { UI.flujo.paso = 'correo'; UI.flujo.error = null; renderModal(); },
  'perfil': (id, b) => {
    UI.flujo.perfilSel = id;
    b.parentElement.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    const est = id === 'Estudiante';
    const lbl = document.getElementById('lbl-ca'); if (lbl) lbl.textContent = est ? 'Carrera' : 'Área';
    const dl = document.getElementById('lista-ca'); if (dl) dl.innerHTML = opcionesCA(id);
    const inp = document.querySelector('input[name="carreraArea"]'); if (inp) inp.placeholder = est ? 'Por ejemplo, Gastronomía Internacional' : 'Por ejemplo, Docencia Gastronomía';
  },
  'editar-datos': () => {
    const f = UI.flujo;
    const p = S.perfiles[S.sesion.email] || {};
    Object.assign(f, { paso: 'datos', nombre: p.nombre || '', carreraArea: p.carreraArea || '', perfilSel: p.perfil || perfilPorDominio(S.sesion.email), error: null });
    renderModal();
  },
  'confirmar-reserva': () => {
    const f = UI.flujo;
    const ev = evento(f.eventoId);
    const email = S.sesion.email;
    const p = S.perfiles[email];
    const ya = reservaDe(ev.id, email);
    if (ya) { cerrarModal(); ir('#/reserva/' + ya.id); return; }
    const est = estadoEvento(ev);
    if (est !== 'abierto') { f.error = est === 'sin-cupos' ? 'Se acaban de agotar los cupos de este evento.' : 'Las reservas para este evento están cerradas.'; renderModal(); return; }
    const r = { id: uid('r'), eventoId: ev.id, email, nombre: p.nombre, perfil: p.perfil, carreraArea: p.carreraArea, codigo: nuevoCodigo(), estado: 'confirmada', creada: Date.now(), asistio: false, asistenciaHora: null, encuestaEnviada: false, respondida: false };
    S.reservas.push(r);
    enviar('confirmacion', ev, [email], r);
    guardar();
    UI.recienReservada = r.id;
    cerrarModal();
    ir('#/reserva/' + r.id);
  },
  'calendario': id => descargarICS(id),
  'descargar-entrada': (id, b) => descargarEntrada(id, b),
  'anular': id => {
    const r = S.reservas.find(x => x.id === id);
    if (!r) return;
    const ev = evento(r.eventoId);
    confirmar({ titulo: 'Anular reserva', texto: '¿Anular la reserva para «' + ev.titulo + '»? El cupo quedará disponible para otra persona.', si: 'Anular reserva' }, () => {
      r.estado = 'anulada'; r.anuladaEn = Date.now(); UI.recienReservada = null; guardar(); toast('Reserva anulada'); render();
    });
  },
  'mis-tab': id => { UI.misTab = id; render(); },
  'nuevo-evento': () => abrirModal({ tipo: 'evento', id: null }),
  'editar-evento': id => abrirModal({ tipo: 'evento', id }),
  'cancelar-evento': id => {
    const ev = evento(id);
    const dest = reservasActivas(id).map(r => r.email);
    confirmar({ titulo: 'Cancelar evento', texto: '«' + ev.titulo + '». ' + (dest.length ? 'Se enviará un aviso a ' + plural(dest.length, 'persona', 'personas') + ' con reserva. ' : 'El evento no tiene reservas. ') + 'Esta acción no se puede deshacer.', si: 'Cancelar evento' }, () => {
      ev.estado = 'cancelado';
      if (dest.length) enviar('cancelacion', ev, dest);
      guardar(); toast('Evento cancelado'); render();
    });
  },
  'ir-recepcion': id => { UI.panelEvento = id; UI.recepcion = { busqueda: '', resultado: null }; ir('#/panel/recepcion'); },
  'ir-resultados': id => { UI.resultadosEvento = id; ir('#/panel/resultados'); },
  'marcar': id => {
    const r = S.reservas.find(x => x.id === id);
    if (!r) return;
    r.asistio = true; r.asistenciaHora = Date.now(); guardar();
    UI.recepcion.resultado = { tipo: 'ok', texto: 'Asistencia registrada: ' + r.nombre, detalle: r.perfil + ', ' + r.carreraArea };
    refrescarRecepcion();
  },
  'desmarcar': id => {
    const r = S.reservas.find(x => x.id === id);
    if (!r) return;
    r.asistio = false; r.asistenciaHora = null; guardar();
    UI.recepcion.resultado = { tipo: 'ya', texto: 'Se quitó la asistencia de ' + r.nombre + '.' };
    refrescarRecepcion();
  },
  'simular-escaneo': () => {
    const ev = evento(UI.panelEvento);
    const pend = reservasActivas(ev.id).filter(r => !r.asistio);
    if (!pend.length) { UI.recepcion.resultado = { tipo: 'ya', texto: 'Todas las reservas ya tienen asistencia registrada.' }; refrescarRecepcion(); return; }
    const propia = S.sesion ? pend.find(r => r.email === S.sesion.email) : null;
    const r = propia || pend[Math.floor(Math.random() * pend.length)];
    registrarCodigo(r.codigo);
  },
  'activar-camara': () => activarCamara(),
  'detener-camara': () => { detenerCamara(); render(); },
  'cerrar-evento': id => {
    const ev = evento(id);
    const n = reservasActivas(id).filter(r => r.asistio).length;
    confirmar({ titulo: 'Cerrar evento', texto: n ? 'Se enviará la encuesta a ' + plural(n, 'persona', 'personas') + ' con asistencia registrada. En el sistema real esto ocurre automáticamente a las ' + ev.termino + ' del ' + fLarga(ev.fecha) + '.' : 'No hay asistencia registrada: el evento se cerrará sin enviar encuestas.', si: n ? 'Enviar encuestas' : 'Cerrar evento' }, () => {
      detenerCamara();
      const enviados = cerrarEvento(ev);
      guardar();
      toast(enviados ? 'Encuesta enviada a ' + plural(enviados, 'persona', 'personas') : 'Evento cerrado');
      render();
    });
  },
  'exportar': id => exportar(id),
  'ver-envio': id => abrirModal({ tipo: 'envio', id }),
  'confirmar-si': () => { const fn = MODAL && MODAL.fn; cerrarModal(); if (fn) fn(); }
};

const FORMULARIOS = {
  correo: f => {
    const email = f.elements.email.value.trim().toLowerCase();
    UI.flujo.email = email;
    if (!correoValido(email)) { UI.flujo.error = 'Use un correo @inacapmail.cl o @inacap.cl.'; renderModal(); return; }
    UI.flujo.error = null;
    UI.flujo.paso = 'revisar';
    enviar('acceso', null, [email]);
    guardar();
    renderModal();
  },
  datos: f => {
    const fl = UI.flujo;
    fl.nombre = f.elements.nombre.value.trim().replace(/\s+/g, ' ');
    fl.carreraArea = f.elements.carreraArea.value.trim();
    if (fl.nombre.length < 3) { fl.error = 'Ingrese su nombre y apellido.'; renderModal(); return; }
    if (!fl.carreraArea) { fl.error = fl.perfilSel === 'Estudiante' ? 'Indique su carrera.' : 'Indique su área.'; renderModal(); return; }
    S.perfiles[S.sesion.email] = { nombre: fl.nombre, perfil: fl.perfilSel, carreraArea: fl.carreraArea };
    guardar();
    fl.error = null;
    if (fl.eventoId) {
      const ya = reservaDe(fl.eventoId, S.sesion.email);
      if (ya) { cerrarModal(); ir('#/reserva/' + ya.id); return; }
      fl.paso = 'confirmar'; renderModal(); render(); return;
    }
    cerrarModal(); toast('Sesión iniciada'); render();
  },
  evento: f => {
    const ev = MODAL.id ? evento(MODAL.id) : null;
    const g = k => f.elements[k].value;
    const v = { titulo: g('titulo').trim(), descripcion: g('descripcion').trim(), fecha: g('fecha'), inicio: g('inicio'), termino: g('termino'), lugar: g('lugar').trim(), aforo: parseInt(g('aforo'), 10) };
    const e = {};
    if (!v.titulo) e.titulo = 'Ingrese un título.';
    if (!v.descripcion) e.descripcion = 'Agregue una descripción breve.';
    if (!v.fecha) e.fecha = 'Elija la fecha.';
    if (!v.inicio) e.inicio = 'Indique la hora de inicio.';
    if (!v.termino) e.termino = 'Indique la hora de término.';
    else if (v.inicio && v.termino <= v.inicio) e.termino = 'Debe ser posterior al inicio.';
    if (!v.lugar) e.lugar = 'Indique el lugar.';
    if (!Number.isFinite(v.aforo) || v.aforo < 1) e.aforo = 'Mínimo 1 persona.';
    else if (v.aforo > 500) e.aforo = 'Máximo 500 personas.';
    else if (ev) { const n = reservasActivas(ev.id).length; if (v.aforo < n) e.aforo = 'Ya hay ' + n + ' reservas.'; }
    if (!e.fecha && !e.inicio && v.fecha && v.inicio && fechaHora(v.fecha, v.inicio) < new Date()) e.fecha = 'La fecha y hora de inicio ya pasaron.';
    if (Object.keys(e).length) { MODAL.valores = v; MODAL.errores = e; renderModal(); return; }
    if (ev) {
      const cambio = ev.fecha !== v.fecha || ev.inicio !== v.inicio || ev.termino !== v.termino || ev.lugar !== v.lugar;
      const cambioFecha = ev.fecha !== v.fecha || ev.inicio !== v.inicio;
      Object.assign(ev, v);
      if (cambioFecha && recordatorioFecha(ev) > new Date()) ev.recordatorioEnviado = false;
      const dest = reservasActivas(ev.id).map(r => r.email);
      if (cambio && dest.length) { enviar('cambio', ev, dest); toast('Evento actualizado. Se avisó a ' + plural(dest.length, 'persona', 'personas') + '.'); }
      else toast('Evento actualizado');
    } else {
      S.eventos.push(Object.assign({ id: uid('e'), estado: 'publicado', cerrado: false, cerradoEn: null, recordatorioEnviado: false, creado: Date.now() }, v));
      toast('Evento publicado');
    }
    planificador();
    guardar();
    cerrarModal();
    render();
  },
  panel: f => {
    const input = f.elements.clave;
    const boton = f.querySelector('button[type="submit"]');
    const err = document.getElementById('err-panel');
    const fallar = msg => { err.textContent = msg; err.hidden = false; input.setAttribute('aria-invalid', 'true'); boton.disabled = false; input.focus(); input.select(); };
    if (!input.value.trim()) { fallar('Ingrese la clave de acceso.'); return; }
    boton.disabled = true;
    huella(normalizarClave(input.value)).then(h => {
      if (h !== CONFIG.panelHuella) { fallar('La clave no es correcta.'); return; }
      abrirPanel();
      render();
      window.scrollTo(0, 0);
      enfocar();
    });
  },
  codigo: f => { registrarCodigo(f.elements.codigo.value); f.elements.codigo.value = ''; },
  encuesta: f => {
    const r = S.reservas.find(x => x.id === f.dataset.id);
    if (!r || r.respondida) { render(); return; }
    const valores = CONFIG.preguntas.map((_, i) => { const x = f.querySelector('input[name="p' + i + '"]:checked'); return x ? Number(x.value) : null; });
    const falta = valores.findIndex(v => v == null);
    if (falta >= 0) {
      document.getElementById('err-encuesta').hidden = false;
      const item = f.querySelectorAll('.item')[falta];
      if (item) item.scrollIntoView({ block: 'center' });
      return;
    }
    S.respuestas.push({ id: uid('q'), eventoId: r.eventoId, valores, comentario: f.elements.comentario.value.trim().slice(0, 500), fecha: Date.now() });
    r.respondida = true;
    guardar();
    UI.gracias = r.id;
    render();
    window.scrollTo(0, 0);
  }
};

/* ===================== Eventos del navegador ===================== */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-accion]');
  if (!b) return;
  const accion = b.dataset.accion;
  if (accion === 'fondo-modal') { if (e.target === b) cerrarModal(); return; }
  if (b.disabled) return;
  const fn = ACCIONES[accion];
  if (!fn) return;
  e.preventDefault();
  fn(b.dataset.id, b, e);
});
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]');
  if (!f) return;
  e.preventDefault();
  const fn = FORMULARIOS[f.dataset.form];
  if (fn) fn(f);
});
document.addEventListener('change', e => {
  const s = e.target.closest('[data-cambio]');
  if (!s) return;
  if (s.dataset.cambio === 'rec-evento') { detenerCamara(); UI.panelEvento = s.value; UI.recepcion = { busqueda: '', resultado: null }; render(); }
  if (s.dataset.cambio === 'res-evento') { UI.resultadosEvento = s.value; render(); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.matches('[data-filtro="rec"]')) { UI.recepcion.busqueda = t.value; filtrarPersonas(); }
  if (t.matches('textarea[name="descripcion"]')) { const c = document.getElementById('contador-desc'); if (c) c.textContent = t.value.length + ' de 400'; }
  if (t.closest('form[data-form="encuesta"]')) { const err = document.getElementById('err-encuesta'); if (err) err.hidden = true; }
  if (t.closest('form[data-form="panel"]')) { const err = document.getElementById('err-panel'); if (err) err.hidden = true; t.removeAttribute('aria-invalid'); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && MODAL) cerrarModal(); });
window.addEventListener('hashchange', () => {
  detenerCamara();
  const r = ruta();
  if (!(r[0] === 'reserva' && r[1] === UI.recienReservada)) UI.recienReservada = null;
  if (!(r[0] === 'encuesta' && r[1] === UI.gracias)) UI.gracias = null;
  if (r[0] === 'mis-reservas') UI.misTab = null;
  UI.recepcion.resultado = null;
  if (MODAL) cerrarModal();
  render();
  window.scrollTo(0, 0);
  enfocar();
});

/* ===================== Inicio ===================== */
if (!cargar()) { sembrar(); guardar(); }
planificador();
render();
if (document.querySelector('#app [data-enfoque]')) enfocar();
setInterval(() => {
  const escribiendo = document.activeElement && document.activeElement.matches('input, textarea, select');
  if (planificador() && !MODAL && !UI.camara && !escribiendo) render();
}, 30000);
})();
</script>
